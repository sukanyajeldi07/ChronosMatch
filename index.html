<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChronosMatch Trading Dashboard</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  background: #080d16;
  color: #e7edf7;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 25px;
}

h1 { margin: 0; font-size: 28px; }
h2 { font-size: 17px; }

.muted {
  color: #8fa0b8;
  font-size: 12px;
}

.status {
  color: #27d7a1;
  border: 1px solid #276b57;
  padding: 8px 12px;
  border-radius: 20px;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin-bottom: 18px;
}

.card, .panel {
  background: #101827;
  border: 1px solid #243247;
  border-radius: 12px;
  padding: 18px;
}

.value {
  font-size: 26px;
  font-weight: bold;
  margin: 12px 0 5px;
}

.green, .bid { color: #27d7a1; }
.red, .price { color: #ff6378; }
.blue { color: #62a8ff; }

.content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th, td {
  padding: 11px 5px;
  text-align: right;
  border-bottom: 1px solid #243247;
}

th:first-child, td:first-child { text-align: left; }

th {
  color: #8fa0b8;
  font-weight: normal;
}

.mid-price {
  text-align: center;
  padding: 14px;
  margin: 10px 0;
  border-radius: 8px;
  background: #080d16;
  font-size: 20px;
  color: #62a8ff;
}

.bars {
  height: 130px;
  display: flex;
  align-items: end;
  gap: 7px;
  margin-top: 20px;
  border-bottom: 1px solid #243247;
}

.bar {
  flex: 1;
  min-width: 3px;
  background: linear-gradient(#62a8ff, #285bc6);
  border-radius: 4px 4px 0 0;
}

footer {
  margin-top: 20px;
  color: #8fa0b8;
  font-size: 12px;
  line-height: 1.6;
}

@media (max-width: 800px) {
  body { padding: 14px; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .content { grid-template-columns: 1fr; }
  .value { font-size: 21px; }
}

@media (max-width: 420px) {
  .metrics { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>⚡ ChronosMatch</h1>
    <div class="muted">LOW-LATENCY ORDER FLOW · WEEK 1</div>
  </div>
  <div class="status">● Demo Dashboard</div>
</header>

<section class="metrics">

  <div class="card">
    <div class="muted">Consumer Throughput</div>
    <div class="value blue">97,512</div>
    <div class="green">orders / second</div>
  </div>

  <div class="card">
    <div class="muted">Orders Processed</div>
    <div class="value">300,000</div>
    <div class="green">Benchmark completed</div>
  </div>
  <div class="card">
    <div class="muted">Mean Latency</div>
    <div class="value">1.358 ms</div>
    <div class="green">Average processing time</div>
</div>

<div class="card">
    <div class="muted">P99 Latency</div>
    <div class="value">2.786 ms</div>
    <div class="green">99th percentile</div>
</div>
<div class="card">
    <div class="muted">P99 Latency</div>
    <div class="value">2.786 ms</div>
    <div class="green">99th percentile</div>
</div>
</section>
